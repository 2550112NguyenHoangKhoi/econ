services:
  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_PASSWORD=econ
      - POSTGRES_USER=econ
      - POSTGRES_DB=econ
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Readiness, not just liveness. `depends_on` alone waits for the CONTAINER to start,
    # which for Postgres is several seconds before it accepts connections — so the engine
    # lost that race on essentially every `docker compose up` and ran with no persistence.
    # pg_isready is the check the image ships for exactly this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econ -d econ"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      # Authenticated by default. Run ./setup-mqtt-auth.sh once to mint mosquitto/passwd
      # before the first start — the broker will not come up without it, which is the
      # correct failure for something that switches mains circuits.
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      # Local demo with no hardware attached? Swap the three lines above for this one:
      # - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://econ:econ@db:5432/econ?sslmode=disable
      - MQTT_BROKER=tcp://mqtt:1883
      - FORECAST_URL=http://forecasting:8000  # consumed by /api/forecast proxy
      - DIGITIZER_URL=http://digitizer:8000   # consumed by /api/digitize proxy
      # Set in a .env next to this file for commercial deployments: deploy/rollback of
      # the running building then require this token (X-Admin-Token). Empty = open, for
      # the local demo only.
      - ECON_ADMIN_TOKEN=${ECON_ADMIN_TOKEN:-}
      # Broker credentials, minted by ./setup-mqtt-auth.sh into .env beside this file.
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # Only needed when the dashboard is served from a DIFFERENT host than the engine.
      # Same-host deployments (including a phone on the LAN) pass without this.
      - ECON_ALLOWED_ORIGINS=${ECON_ALLOWED_ORIGINS:-}
      # Building-local timezone. The APLC plug sweep arms OUTSIDE work hours by the
      # wall clock of the building, not of the container (which defaults to UTC — 7
      # hours off in Vietnam, i.e. armed at lunch, disarmed at midnight).
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Deployed buildings, their automatic backups, and the audit log must survive a
      # container rebuild — without this, `docker compose up --build` silently reverts
      # the building to the one baked into the image. Named volume seeds from the image
      # on first creation.
      - server-data:/app/data
    depends_on:
      # service_healthy, not the bare list form: the engine must not start until Postgres is
      # actually answering. The engine now retries in the background as well (see initDB),
      # so this is belt AND braces — but the retry exists for database restarts, and this
      # exists so a cold start is simply correct the first time.
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      forecasting:
        condition: service_started

  # Blueprint digitizer (FastAPI): DXF/PDF/image in, building-data.json out, wrapping
  # ai_modules/branch_b_digitization. The dashboard talks to it only through the Go
  # server's /api/digitize proxy, so the frontend keeps a single backend origin.
  digitizer:
    build:
      context: ..
      dockerfile: digitizer/Dockerfile
    ports:
      - "8090:8000"

  # Python LSTM peak-load forecaster (FastAPI). Trains at build time, so it ships with real
  # weights + scaler (no random-init predictions). Independent of db/mqtt. POST /predict,
  # GET /health. Set OPENWEATHER_API_KEY in a .env next to this compose file for live weather;
  # without it the service runs with a flagged fallback (weather_source="fallback").
  forecasting:
    build:
      context: ../backend/forecasting
    ports:
      - "8000:8000"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - WEATHER_LAT=${WEATHER_LAT:-10.7724}
      - WEATHER_LON=${WEATHER_LON:-106.6581}

volumes:
  db-data:
  server-data:
