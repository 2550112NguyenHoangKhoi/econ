[env:esp32dev]
; Pinned. Leaving this unpinned let the platform float to 7.x, which requires a newer
; framework-arduinoespressif32 build than the one on disk — so every build then tried to
; download one, and PlatformIO's mirror is serving a certificate for the wrong hostname,
; which hangs the build indefinitely rather than failing. 6.13.0 uses the framework already
; installed (3.20017.241212), so builds are offline and reproducible.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
; USE_STRIP=1: the ACS712 and its 10k/10k divider are now fitted on GPIO32. The firmware's
; own rest-level check agrees -- "[strip] rest level 1320 counts agrees with divider ratio
; 0.50" -- and an unloaded strip publishes stripW 0.0, not the ~3.8 kW this channel produced
; while the pin was floating.
;
; That earlier failure is the reason this flag exists, and the reason to set it back to 0 the
; moment the sensor comes off: a floating ADC pin sits at mid-rail and picks up 50 Hz mains
; hum, which the DSP correctly identifies as a periodic signal and publishes as kilowatts of
; load that does not exist. The rest-level check cannot catch that on its own -- a floating
; pin's DC level looks perfectly healthy. At 0 the firmware omits stripW entirely, which is
; the honest answer when the sensor is absent; an unwired channel must never publish 0.0 W,
; because a fabricated zero tells the twin the circuit is idle.
build_flags = -std=gnu++17 -DUSE_CAMERA=0 -DCAMERA_WIRING_REMOVED=1 -DUSE_IR_AC=1 -DIR_AC_PROTOCOL=ELECTRA_AC -DIR_PIN=25 -DPLUG_RELAY_PIN=26 -DPLUG_RELAY_ACTIVE_LOW=0 -DSTRIP_ADC_PIN=32 -DPLUG_ADC_PIN=33 -DI2C_SDA=21 -DI2C_SCL=22 -DUSE_SHT30=1 -DUSE_CO2=1 -DUSE_PLUG=1 -DUSE_STRIP=1 -DUSE_PIR=0 -DUSE_MMWAVE=1 -DMMWAVE_PIN=13 -DMMWAVE2_PIN=14 -DUSE_MMWAVE_UART=1 -DUSE_MMWAVE2_UART=1 -DMMWAVE_UART_RX=16 -DMMWAVE_UART_TX=17 -DMMWAVE2_UART_RX=4 -DMMWAVE2_UART_TX=18 -DRD03_SET_MIN_GATE=1 -DRD03_SET_MAX_GATE=5 -DRD03_SET_DELAY_S=2 -DRD03_FRAME_FILTERS=1 -DRD03_FRAMES_DETECT=15
build_src_filter = +<*>

lib_deps =
  ; TensorFlowLite_ESP32 removed. Its only consumers were src/camera/person_detector.cpp and
  ; model_data.cpp, both dead since USE_CAMERA=0 (the OV7670 was retired; see edge/WIRING.md).
  ; person_detector.cpp is already wrapped in #if USE_CAMERA, so nothing includes a TF header
  ; in this build -- but the library was still compiled in full on every build, which is where
  ; most of the build time went. Restore this line if USE_CAMERA is ever set back to 1.
  bblanchon/ArduinoJson @ ^6.21.3
  knolleary/PubSubClient @ ^2.8
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.9
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
