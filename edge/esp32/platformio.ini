[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DUSE_CAMERA=1 -DUSE_IR_AC=1 -DIR_AC_PROTOCOL=ELECTRA_AC -DRELAY_PIN=13 -DIR_PIN=25 -DPLUG_RELAY_PIN=27 -DSTRIP_ADC_PIN=33 -DPLUG_ADC_PIN=34 -DI2C_SDA=21 -DI2C_SCL=22 -DUSE_SHT30=1 -DUSE_CO2=1 -DUSE_PLUG=1 -DUSE_STRIP=1
build_src_filter = +<*>

lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32
  bblanchon/ArduinoJson @ ^6.21.3
  knolleary/PubSubClient @ ^2.8
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.9
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
